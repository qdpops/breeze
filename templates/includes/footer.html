<roundcube:if condition="!env:framed || env:extwin" />
</div>
<roundcube:if condition="config:support_url" />
<a href="<roundcube:var name='config:support_url' />" target="_blank" id="supportlink" class="hidden"><roundcube:label name="support" /></a>
<roundcube:endif />
<roundcube:endif />

<roundcube:if condition="env:task == 'mail' && !env:action && !env:framed" />
<!-- floating compose panel; outside #layout so Elastic's ui.js doesn't treat it as a layout column -->
<div id="tw-compose" class="tw-compose" role="dialog" aria-labelledby="tw-compose-title" hidden>
	<div class="tw-compose-head">
		<span id="tw-compose-title" class="tw-compose-title"><roundcube:label name="tw_folders.compose" /></span>
		<a href="#minimize" class="tw-btn tw-icon-only ti ti-minus" data-tw-compose="min" title="<roundcube:label name="tw_folders.minimize" />"><span class="inner"><roundcube:label name="tw_folders.minimize" /></span></a>
		<a href="#maximize" class="tw-btn tw-icon-only ti ti-maximize" data-tw-compose="max" title="<roundcube:label name="tw_folders.maximize" />"><span class="inner"><roundcube:label name="tw_folders.maximize" /></span></a>
		<a href="#close" class="tw-btn tw-icon-only ti ti-close" data-tw-compose="close" title="<roundcube:label name="close" />"><span class="inner"><roundcube:label name="close" /></span></a>
	</div>
	<iframe id="tw-compose-frame" name="tw-compose-frame" title="<roundcube:label name="tw_folders.compose" />" src="about:blank"></iframe>
</div>
<roundcube:endif />

<roundcube:object name="message" id="messagestack" />

<script src="/deps/bootstrap.bundle.min.js"></script>
<script src="/ui.js"></script>
<script src="/breeze.js"></script>

</body>
</html>
