<!-- top bar on desktop, slide-out app menu on phones (Elastic's ui.js drives the latter) -->
<div id="layout-menu">
	<h2 id="aria-label-tasknav" class="voice"><roundcube:label name="arialabeltasknav" /></h2>
	<div class="popover-header">
		<a class="tw-logo" href="./?_task=mail" aria-label="<roundcube:object name="productname" />">roundcube<span>›mail</span></a>
		<a class="button icon cancel"><span class="inner"><roundcube:label name="close" /></span></a>
	</div>
	<div id="tw-search-slot"></div>
	<div id="taskmenu" class="menu" role="navigation" aria-labelledby="aria-label-tasknav">
		<span class="action-buttons">
			<roundcube:button command="compose" type="link" class="tw-nav ti ti-mail compose"
				label="compose" title="writenewmessage" innerclass="inner"
				data-fab="true" data-fab-task="mail" data-fab-action="none" />
		</span>
		<roundcube:button command="mail" label="mail" type="link" innerClass="inner"
			class="tw-nav ti ti-inbox mail" classSel="tw-nav ti ti-inbox mail selected" />
		<roundcube:button command="addressbook" label="contacts" type="link" innerClass="inner"
			class="tw-nav ti ti-contacts contacts" classSel="tw-nav ti ti-contacts contacts selected" />
		<roundcube:container name="taskbar" id="taskmenu" />
		<roundcube:button command="settings" label="settings" type="link" innerClass="inner"
			class="tw-nav ti ti-settings settings" classSel="tw-nav ti ti-settings settings selected" />
		<span class="special-buttons">
			<roundcube:button name="about" label="about" type="link" title="about"
				class="tw-nav tw-icon-only ti ti-help about" innerClass="inner" onclick="UI.about_dialog(this)" />
			<roundcube:button command="logout" label="logout" type="link" title="logout"
				class="tw-nav tw-icon-only ti ti-logout logout" innerClass="inner" />
		</span>
	</div>
</div>
